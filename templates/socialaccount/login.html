{% load i18n %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexão Segura - ClinEng</title>
    
    <!-- Tailwind, Fontes e Ícones -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #090d18; color: #e2e8f0; }
        .glass-card { background: #161d2e; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }

        /* A NOVA ANIMAÇÃO MÁGICA */
        .logo-container {
            /* cubic-bezier cria um efeito de "mola" (vai rápido e dá um saltinho no final) */
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        
        .spin-and-grow {
            transform: scale(1.4) rotate(360deg);
            box-shadow: 0 0 30px rgba(66, 133, 244, 0.3); /* Brilho azul da Google */
            border-color: rgba(66, 133, 244, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Efeitos de Luz de Fundo animada -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-teal-500/10 rounded-full blur-3xl animate-pulse-slow"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1.5s;"></div>

    <!-- Cartão de Autorização -->
    <div class="glass-card w-full max-w-md rounded-2xl p-8 text-center relative z-10 animate-slide-up">
        
        <!-- Ícone Animado (Agora com as cores originais da Google) -->
        <div id="googleLogo" class="logo-container w-20 h-20 mx-auto bg-slate-800 rounded-full border border-slate-600 flex items-center justify-center mb-6 shadow-lg relative z-20 bg-white/5 backdrop-blur-sm">
            <!-- SVG Oficial do Google -->
            <svg viewBox="0 0 24 24" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Conexão Segura</h1>
        <p class="text-sm text-slate-400 mb-8 leading-relaxed">
            Você está prestes a entrar no <strong>ClinEng</strong> usando a sua conta Institucional do Google.
        </p>

        <!-- Formulário OBRIGATÓRIO do allauth -->
        <form method="post" id="authForm">
            {% csrf_token %}
            <button type="submit" id="submitBtn" class="w-full flex items-center justify-center gap-2 px-6 py-3.5 bg-teal-500 hover:bg-teal-400 text-slate-900 text-sm font-bold rounded-xl transition-all shadow-lg shadow-teal-500/20 hover:scale-[1.02] active:scale-95">
                <i class="fas fa-shield-alt"></i> Autorizar e Continuar
            </button>
        </form>

        <div class="mt-8">
            <a href="{% url 'login' %}" class="text-xs font-medium text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-wider">
                Cancelar e voltar
            </a>
        </div>
    </div>

    <script>
        // Dispara a animação assim que o botão for clicado
        document.getElementById('authForm').addEventListener('submit', function() {
            const logo = document.getElementById('googleLogo');
            const btn = document.getElementById('submitBtn');
            
            // Adiciona a classe que faz a logo crescer e girar 360 graus à direita
            logo.classList.add('spin-and-grow');
            
            // Feedback visual no botão enquanto o Django processa o login
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
            btn.classList.add('opacity-80', 'cursor-not-allowed', 'pointer-events-none');
        });
    </script>
</body>
</html>
