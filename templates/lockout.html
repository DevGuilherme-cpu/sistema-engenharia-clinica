<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Bloqueado — ClinEng</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0d14; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 24px 64px rgba(0,0,0,0.45); }
    .bg-grid { background-image: radial-gradient(circle, rgba(248,113,113,0.1) 1px, transparent 1px); background-size: 28px 28px; }
  </style>
</head>
<body class="relative overflow-hidden">

  <div class="absolute inset-0 bg-grid opacity-60 pointer-events-none"></div>
  
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="glass-card relative w-full max-w-md rounded-2xl p-10 text-center z-10 mx-4">
    
    <div class="mx-auto w-20 h-20 rounded-full flex items-center justify-center mb-6 animate-pulse" style="background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3);">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-white mb-3 tracking-tight">Acesso Bloqueado</h1>
    
    <p class="text-sm text-slate-400 mb-8 leading-relaxed">
      Detectámos múltiplas tentativas de login inválidas. Por motivos de segurança e proteção de dados, o seu acesso foi temporariamente suspensa.
    </p>

    <div class="bg-black/40 border border-white/5 rounded-xl py-6 mb-8">
      <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold mb-2">Tempo Restante</p>
      <div id="timer" class="text-5xl font-mono font-bold text-red-400 tracking-wider">05:00</div>
    </div>

    <a href="{% url 'login' %}" id="btn-voltar" class="hidden w-full flex items-center justify-center gap-2 py-3.5 rounded-xl font-semibold text-white transition-all hover:brightness-110 active:scale-95" style="background: linear-gradient(135deg, #4f80e8 0%, #3ac8b4 100%);">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Tentar Novamente
    </a>
  </div>

  <script>
    // Configurar os 5 minutos (300 segundos)
    let tempoRestante = 300; 
    const displayTimer = document.getElementById('timer');
    const btnVoltar = document.getElementById('btn-voltar');

    const intervalo = setInterval(() => {
      tempoRestante--;

      // Calcular minutos e segundos
      let minutos = Math.floor(tempoRestante / 60);
      let segundos = tempoRestante % 60;

      // Adicionar o zero à esquerda (ex: 04:09)
      minutos = minutos < 10 ? '0' + minutos : minutos;
      segundos = segundos < 10 ? '0' + segundos : segundos;

      // Atualizar no ecrã
      displayTimer.textContent = `${minutos}:${segundos}`;

      // Quando o tempo acabar
      if (tempoRestante <= 0) {
        clearInterval(intervalo);
        displayTimer.textContent = "00:00";
        displayTimer.classList.remove('text-red-400');
        displayTimer.classList.add('text-green-400');
        btnVoltar.classList.remove('hidden');
      }
    }, 1000);
  </script>
</body>
</html>
