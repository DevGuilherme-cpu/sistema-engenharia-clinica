{% extends 'base.html' %}
{% load static %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
    /* Estilos Premium para o Formulário */
    .form-container {
        font-family: "Inter", sans-serif;
        min-height: calc(100vh - 64px);
    }
    
    .card-glass {
        background: #161d2e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .input-premium {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        transition: all 0.3s ease;
    }
    
    .input-premium:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: #2dd4bf;
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
        outline: none;
    }

    /* Estilização bonita para os Checkboxes */
    .checklist-item {
        transition: all 0.2s;
    }
    .checklist-item:hover {
        background: rgba(255, 255, 255, 0.03);
        border-color: rgba(45, 212, 191, 0.3);
    }
    input[type="checkbox"] {
        accent-color: #2dd4bf; /* Cor da caixinha quando marcada */
    }
</style>

<div class="form-container bg-[#090d18] w-full text-gray-200 p-5 md:p-8">
    
    <!-- Cabeçalho da Página -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-teal-500/10 border border-teal-500/20">
                <i class="fas fa-clipboard-check text-teal-400"></i>
            </div>
            Registrar Manutenção Preventiva
        </h1>
        <p class="text-sm text-slate-400 mt-2 ml-13">O status do equipamento será atualizado automaticamente após o registro.</p>
    </div>

    <!-- Cartão do Formulário -->
    <div class="card-glass rounded-2xl p-6 md:p-8 max-w-5xl">
        <!-- Corrigido de url_for para sintaxe Django padrão -->
        <form action="{% url 'cadastrar_manutencao' %}" method="POST" id="form-preventiva">
            {% csrf_token %}
            
            <div class="space-y-6">
                <!-- Seção 1: Dados Principais -->
                <div>
                    <h3 class="text-xs font-bold text-slate-500 tracking-wider uppercase mb-4 border-b border-white/5 pb-2">
                        <i class="fas fa-desktop mr-2 text-slate-400"></i> Dados da Intervenção
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-slate-400 mb-2">Equipamento Relacionado *</label>
                            <select name="monitor_id" required class="input-premium w-full rounded-xl px-4 py-3 text-sm appearance-none">
                              <option value="">-- Selecione o Monitor / Equipamento --</option>
                              {% for monitor in equipamentos %}
                              <option value="{{ monitor.id }}">
                                  Patrimônio: {{ monitor.patrimonio|default:"N/A" }} | S/N: {{ monitor.numero_serie }} - {{ monitor.descricao }} - {{ monitor.marca|default:"Sem Marca" }}
                              </option>
                              {% endfor %}
                          </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-2">Data da Execução *</label>
                            <input type="date" name="data_preventiva" required class="input-premium w-full rounded-xl px-4 py-3 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-2">Mês de Referência *</label>
                            <select name="mes" required class="input-premium w-full rounded-xl px-4 py-3 text-sm appearance-none">
                                <option value="Janeiro">Janeiro</option>
                                <option value="Fevereiro">Fevereiro</option>
                                <option value="Março">Março</option>
                                <option value="Abril">Abril</option>
                                <option value="Maio">Maio</option>
                                <option value="Junho">Junho</option>
                                <option value="Julho">Julho</option>
                                <option value="Agosto">Agosto</option>
                                <option value="Setembro">Setembro</option>
                                <option value="Outubro">Outubro</option>
                                <option value="Novembro">Novembro</option>
                                <option value="Dezembro">Dezembro</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Seção 2: CHECKLIST MÁGICO DE ACESSÓRIOS -->
                <div class="pt-4">
                    <h3 class="text-xs font-bold text-teal-500 tracking-wider uppercase mb-4 border-b border-white/5 pb-2">
                        <i class="fas fa-tasks mr-2"></i> Checklist de Acessórios (Inspeção Visual e Funcional)
                    </h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        <!-- ECG & TEMP -->
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Cabo de ECG (3/5 Vias)" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Cabo de ECG</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Sensor de Temperatura 1" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Sensor TEMP-1</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Sensor de Temperatura 2" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Sensor TEMP-2</span>
                        </label>

                        <!-- SpO2 -->
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Cabo/Sensor SpO2 - Adulto" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">SpO2 Adulto</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Cabo/Sensor SpO2 - Infantil/Neo" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">SpO2 Infantil</span>
                        </label>

                        <!-- PAI e Capnografia -->
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Cabo Módulo PAI-1" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Módulo PAI-1</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Cabo Módulo PAI-2" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Módulo PAI-2</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Módulo Capnografia" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Capnografia</span>
                        </label>

                        <!-- PNI -->
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Mangueira/Tubo PNI" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Cabo/Mangueira PNI</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Abraçadeira PNI - Adulto" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Abraçadeira Adulto</span>
                        </label>
                        <label class="checklist-item flex items-center gap-3 p-3 rounded-xl border border-white/5 bg-white/5 cursor-pointer">
                            <input type="checkbox" value="Abraçadeira PNI - Infantil" class="w-4 h-4 rounded acessorio-cb">
                            <span class="text-sm text-slate-300 font-medium">Abraçadeira Infantil</span>
                        </label>
                    </div>
                </div>

                <!-- Seção 3: Conclusão do Laudo -->
                <div class="pt-4 border-t border-white/5">
                    <div class="grid grid-cols-1 gap-5">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-2">Técnico Responsável *</label>
                            <!-- Usando o nome do utilizador logado por padrão se possível -->
                            <input type="text" name="responsavel" value="{{ user.first_name|default:user.username }}" required class="input-premium w-full md:w-1/2 rounded-xl px-4 py-3 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-2">Observações / Laudo (Opcional)</label>
                            <textarea name="descricao" id="campo-descricao" rows="4" class="input-premium w-full rounded-xl px-4 py-3 text-sm" placeholder="Digite observações extras. Os acessórios marcados acima serão adicionados aqui automaticamente..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="mt-10 flex flex-col sm:flex-row items-center justify-end gap-4 border-t border-white/5 pt-6">
                <a href="{% url 'dashboard' %}" class="w-full sm:w-auto px-6 py-3 text-sm font-semibold text-slate-300 hover:text-white transition-colors text-center border border-transparent hover:border-slate-600 rounded-xl">
                    Cancelar
                </a>
                <button type="submit" class="w-full sm:w-auto px-8 py-3 text-sm font-bold text-slate-900 bg-teal-400 hover:bg-teal-300 rounded-xl transition-all shadow-[0_0_15px_rgba(45,212,191,0.3)] hover:shadow-[0_0_25px_rgba(45,212,191,0.5)] transform hover:-translate-y-0.5">
                    <i class="fas fa-save mr-2"></i> Salvar Preventiva
                </button>
            </div>
        </form>
    </div>
</div>

<!-- O "Cérebro" que junta os acessórios no campo de texto -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById('form-preventiva');
    const campoDescricao = document.getElementById('campo-descricao');
    
    form.addEventListener('submit', function(e) {
        // Encontra todas as caixinhas que o técnico marcou
        const caixasMarcadas = document.querySelectorAll('.acessorio-cb:checked');
        
        if (caixasMarcadas.length > 0) {
            let textoAcessorios = "\n\n--- ACESSÓRIOS VERIFICADOS / TROCADOS ---\n";
            caixasMarcadas.forEach(caixa => {
                textoAcessorios += `[✓] ${caixa.value}\n`;
            });
            
            // Adiciona a lista bonitinha no final do que o técnico já escreveu
            if (!campoDescricao.value.includes("ACESSÓRIOS VERIFICADOS")) {
                campoDescricao.value += textoAcessorios;
            }
        }
    });
});
</script>
{% endblock %}
