{% extends 'base.html' %} {% block content %}
<div
  class="conteudo-centralizado"
  style="
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  "
>
  <h2 style="color: #333; margin-bottom: 25px; text-align: center">
    <i class="fas fa-user-plus"></i> Cadastrar Novo Usuário
  </h2>

  {% with messages = get_flashed_messages(with_categories=true) %} {% if
  messages %} {% for category, message in messages %}
  <div
    style="padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-weight: bold; 
                      background-color: {% if category == 'erro' %}#f8d7da{% else %}#d4edda{% endif %};
                      color: {% if category == 'erro' %}#721c24{% else %}#155724{% endif %};"
  >
    {{ message }}
  </div>
  {% endfor %} {% endif %} {% endwith %}

  <form method="POST" style="display: flex; flex-direction: column; gap: 15px">
    <div class="form-group">
      <label style="font-weight: bold; color: #555">Nome Completo</label>
      <input
        type="text"
        name="nome"
        required
        placeholder="Ex: João Silva"
        style="
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          box-sizing: border-box;
        "
      />
    </div>

    <div class="form-group">
      <label style="font-weight: bold; color: #555">E-mail (Login)</label>
      <input
        type="email"
        name="email"
        required
        placeholder="joao@hgp.com"
        style="
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          box-sizing: border-box;
        "
      />
    </div>

    <div class="form-group">
      <label style="font-weight: bold; color: #555">Senha Temporária</label>
      <input
        type="password"
        name="senha"
        required
        placeholder="Crie uma senha inicial"
        style="
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          box-sizing: border-box;
        "
      />
    </div>

    <div class="form-group">
      <label style="font-weight: bold; color: #555"
        >Cargo / Nível de Acesso</label
      >
      <select
        name="cargo"
        required
        style="
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          box-sizing: border-box;
        "
      >
        <option value="Técnico">Técnico (Pode registrar preventivas)</option>
        <option value="Engenheiro">Engenheiro (Pode cadastrar máquinas)</option>
        <option value="Supervisor">
          Supervisor (Acesso a relatórios avançados)
        </option>
        <option value="Administrador">Administrador (Acesso total)</option>
      </select>
    </div>

    <button
      type="submit"
      style="
        background-color: #007bff;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 10px;
      "
    >
      <i class="fas fa-save"></i> Criar Usuário
    </button>
  </form>
</div>
{% endblock %}
