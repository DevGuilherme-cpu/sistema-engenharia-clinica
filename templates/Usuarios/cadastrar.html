{% extends 'base.html' %}
{% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<div style="flex:1; overflow-y:auto; padding: 32px 36px 60px;">
  <div style="margin-bottom:28px;">
    <h1 style="font-size:22px; font-weight:700; color:#e2e8f0; margin:0 0 5px;">Cadastrar Novo Usuário</h1>
    <p style="font-size:13.5px; color:rgba(255,255,255,0.38); margin:0;">Crie credenciais de acesso para a equipe da Engenharia Clínica.</p>
  </div>

  {% if mensagem %}
    <div style="background:rgba(239, 68, 68, 0.15); border:1px solid rgba(239, 68, 68, 0.3); color:#fca5a5; padding:12px 16px; border-radius:10px; margin-bottom:20px; font-size:13.5px;">
      {{ mensagem }}
    </div>
  {% endif %}

  <div style="background: #161d2e; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 28px; max-width: 600px; box-shadow: 0 8px 32px rgba(0,0,0,0.28);">
    <form method="POST">
      {% csrf_token %}
      
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12.5px; font-weight:600; color:#94a3b8; margin-bottom:8px; text-transform:uppercase;">Nome Completo / Técnico *</label>
        <input type="text" name="first_name" required placeholder="Ex: João Silva" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px 14px; color:#e2e8f0; font-size:14px; outline:none;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12.5px; font-weight:600; color:#94a3b8; margin-bottom:8px; text-transform:uppercase;">Nome de Usuário (Login) *</label>
        <input type="text" name="username" required placeholder="Ex: joaosilva" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px 14px; color:#e2e8f0; font-size:14px; outline:none;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12.5px; font-weight:600; color:#94a3b8; margin-bottom:8px; text-transform:uppercase;">E-mail</label>
        <input type="email" name="email" placeholder="tecnico@hospital.com" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px 14px; color:#e2e8f0; font-size:14px; outline:none;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size:12.5px; font-weight:600; color:#94a3b8; margin-bottom:8px; text-transform:uppercase;">Senha Inicial *</label>
        <input type="password" name="password" required placeholder="••••••••" style="width:100%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:12px 14px; color:#e2e8f0; font-size:14px; outline:none;">
      </div>

      <div style="margin-bottom: 28px; display:flex; align-items:center; gap:10px;">
        <input type="checkbox" name="is_staff" id="is_staff" style="width:18px; height:18px; accent-color:#2dd4bf; cursor:pointer;">
        <label for="is_staff" style="font-size:13.5px; color:#cbd5e1; cursor:pointer;">Conceder permissões de Administrador</label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; border-top:1px solid rgba(255,255,255,0.05); padding-top:20px;">
        <button type="submit" style="background:#2dd4bf; border:none; color:#0f172a; padding:10px 24px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer;">Criar Usuário</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
